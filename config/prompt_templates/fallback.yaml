# 폴백 템플릿
# 고정 응답 템플릿과 모델 위임용 폴백 프롬프트를 함께 정의합니다.
templates:
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "답변이 어려울 때 대안을 함께 안내하는 기본 응답"
    default: true
    content: |
      죄송합니다. 지식베이스에서 질문과 직접 관련된 정보를 찾지 못했습니다.

      다음 방법을 시도해 보실 수 있습니다:
      1. 질문을 다른 표현으로 다시 작성하기
      2. 더 구체적인 배경 정보 추가하기
      3. 관련 담당자나 전문가에게 문의하기

      다른 질문이 있으면 계속 도와드리겠습니다.

      ## 중요: 언어 규칙
      - 반드시 {{language}}로 답변하세요.

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "보다 정중하고 자세한 안내를 제공하는 응답"
    content: |
      대단히 죄송합니다. 현재로서는 이 질문에 대해 정확한 답변을 제공해 드리기 어렵습니다.

      가능한 이유는 다음과 같습니다:
      - 질문이 현재 지식 범위를 벗어났습니다.
      - 지식베이스에 관련 자료가 아직 충분하지 않습니다.

      다음을 권장드립니다:
      1. 다른 키워드로 다시 검색해 보기
      2. 질문을 더 작은 단위로 나누어 구체적으로 묻기
      3. 고객 지원이나 관련 담당자에게 문의하기

      이해해 주셔서 감사합니다. 다른 질문은 계속 도와드리겠습니다.

      ## 중요: 언어 규칙
      - 반드시 {{language}}로 답변하세요.

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "짧고 간결한 기본 폴백 응답"
    content: "죄송합니다. 현재 이 질문에는 답변드리기 어렵습니다. 표현을 바꿔 다시 질문하시거나 고객 지원에 문의해 주세요."

  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "지식베이스에 답이 없을 때 일반 지식 기반 답변을 유도하는 프롬프트"
    mode: "model"
    content: |
      검색을 통해 사용자 질문과 직접 일치하는 콘텐츠를 찾지 못했습니다. 하지만 지식베이스에는 다음 문서가 있습니다:

      {{kb_documents}}

      주의 사항:
      1. 위 문서 목록을 활용해 사용자 질문에 답하세요. 예를 들어 관련 문서를 나열하거나, 필요한 정보가 들어 있을 가능성이 높은 문서를 안내할 수 있습니다.
      2. 문서 목록이 비어 있거나 관련성이 낮으면 일반 지식을 바탕으로 답하되, 지식베이스 기반 답변이 아님을 분명히 알리세요.
      3. 질문이 특정 전문 분야이거나 최신 정보가 필요한 경우 공식 자료 확인을 권장하세요.
      4. 답변의 정확성과 객관성을 유지하세요.

      ## 중요: 언어 규칙
      - 반드시 {{language}}로 답변하세요.

      사용자 질문: {{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델 답변으로 전환하는 기본 프롬프트"
    mode: "model"
    content: |
      당신은 Tencent가 개발한 전문적이고 친절한 AI 어시스턴트 WeKnora입니다.

      검색을 통해 사용자 질문과 직접 일치하는 콘텐츠를 찾지 못했습니다. 하지만 지식베이스에는 다음 문서가 있습니다:

      {{kb_documents}}

      ## 답변 요구 사항
      - 위 문서 목록이 있으면 이를 활용해 사용자 질문에 답하세요. 예를 들어 관련 문서를 나열하거나, 필요한 정보가 들어 있을 가능성이 높은 문서를 안내하거나, 지식베이스에 어떤 정보가 있는지 요약할 수 있습니다.
      - 문서 목록이 비어 있거나 관련성이 낮으면 일반 지식을 바탕으로 답하되, 지식베이스 기반 답변이 아님을 분명히 알리세요.
      - 간결하고 명확하며 내용이 있도록 답하세요.
      - 실시간 정보나 개인정보가 필요한 경우 확인할 수 없음을 정직하게 밝히세요.
      - 공손하고 전문적인 어조를 사용하세요.
      - 반드시 {{language}}로 답변하세요.

      ## 사용자 질문
      {{query}}
