<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCFCE7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad1)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="100" fill="#10B981" opacity="0.04"/>
  <circle cx="700" cy="520" r="120" fill="#10B981" opacity="0.04"/>

  <!-- Title -->
  <text x="400" y="70" font-family="PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#065F46" text-anchor="middle">지능형 문서 검색</text>
  <text x="400" y="105" font-family="PingFang SC, sans-serif" font-size="16" fill="#059669" text-anchor="middle">멀티모달 문서 파싱 • 의미 이해 • 정확한 검색</text>

  <!-- Search Interface -->
  <g transform="translate(100, 150)">
    <!-- Search box with icon -->
    <rect width="600" height="60" rx="12" fill="white" stroke="#10B981" stroke-width="2.5" filter="drop-shadow(0 4px 20px rgba(16, 185, 129, 0.15))"/>
    <circle cx="35" cy="30" r="12" stroke="#10B981" stroke-width="2.5" fill="none"/>
    <line x1="44" y1="39" x2="52" y2="47" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
    <text x="70" y="36" font-family="PingFang SC, sans-serif" font-size="16" fill="#9CA3AF">검색어를 입력하여 지능형 검색을 시작하세요...</text>

    <!-- Search button -->
    <rect x="480" y="12" width="100" height="36" rx="8" fill="#10B981"/>
    <text x="530" y="36" font-family="PingFang SC, sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle">검색</text>
  </g>

  <!-- Document Results -->
  <!-- Result 1 -->
  <g transform="translate(100, 250)">
    <rect width="600" height="90" rx="12" fill="white" stroke="#10B981" stroke-width="2" filter="drop-shadow(0 2px 12px rgba(16, 185, 129, 0.1))"/>

    <!-- Document icon -->
    <g transform="translate(25, 20)">
      <rect width="50" height="50" rx="8" fill="#D1FAE5"/>
      <path d="M15 15 L35 15 M15 25 L35 25 M15 35 L25 35" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Content -->
    <text x="95" y="35" font-family="PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#065F46">RAG 시스템 기술 문서.pdf</text>
    <text x="95" y="57" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B7280">검색 증강 생성의 핵심 원리와 구현 방안을 상세히 소개...</text>
    <text x="95" y="75" font-family="PingFang SC, sans-serif" font-size="12" fill="#9CA3AF">3.2 MB • 127페이지 • 2024-01-20</text>
  </g>

  <!-- Result 2 -->
  <g transform="translate(100, 360)">
    <rect width="600" height="90" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 8px rgba(0, 0, 0, 0.05))"/>

    <!-- Document icon -->
    <g transform="translate(25, 20)">
      <rect width="50" height="50" rx="8" fill="#DBEAFE"/>
      <path d="M15 15 L35 15 M15 25 L35 25 M15 35 L28 35" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Content -->
    <text x="95" y="35" font-family="PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#1F2937">벡터 검색 최적화 방안.docx</text>
    <text x="95" y="57" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B7280">Embedding 기반 의미 검색 기술의 실전 및 최적화...</text>
    <text x="95" y="75" font-family="PingFang SC, sans-serif" font-size="12" fill="#9CA3AF">1.8 MB • 45페이지 • 2024-01-19</text>
  </g>

  <!-- Result 3 -->
  <g transform="translate(100, 470)">
    <rect width="600" height="90" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1.5" filter="drop-shadow(0 2px 8px rgba(0, 0, 0, 0.05))"/>

    <!-- Image icon -->
    <g transform="translate(25, 20)">
      <rect width="50" height="50" rx="8" fill="#FEF3C7"/>
      <circle cx="20" cy="28" r="5" fill="#F59E0B"/>
      <path d="M12 42 L20 34 L28 42 L38 32" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Content -->
    <text x="95" y="35" font-family="PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#1F2937">지식 그래프 아키텍처.png</text>
    <text x="95" y="57" font-family="PingFang SC, sans-serif" font-size="13" fill="#6B7280">지식 그래프의 노드 관계와 쿼리 경로 표시...</text>
    <text x="95" y="75" font-family="PingFang SC, sans-serif" font-size="12" fill="#9CA3AF">1.2 MB • 1920×1080 • 2024-01-18</text>
  </g>
</svg>

